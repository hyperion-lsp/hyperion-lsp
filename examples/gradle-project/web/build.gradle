plugins {
    id 'java'
    id 'application'
}

description = 'Web application with Spring Boot'

dependencies {
    // Depend on service module
    implementation project(':service')
    implementation project(':api')
    implementation project(':core')

    // Spring Boot (using version in local cache)
    implementation 'org.springframework.boot:spring-boot-starter-web:3.5.0'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa:3.5.0'
    implementation 'org.springframework.boot:spring-boot-starter-validation:3.5.0'

    // Additional libraries
    implementation 'org.springframework.boot:spring-boot-starter-actuator:3.5.0'

    // Development tools
    developmentOnly 'org.springframework.boot:spring-boot-devtools:3.5.0'

    // Test dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.5.0'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
}

application {
    mainClass = 'com.hyperion.example.web.Application'
}
