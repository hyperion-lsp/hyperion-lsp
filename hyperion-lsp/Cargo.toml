[package]
name = "hyperion-lsp"
publish = false
description = "Java and Kotlin language server with Gradle and Maven project support"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# glibc allocator tuning (see src/allocator.rs)
libc = "0.2"

# LSP framework
tower-lsp.workspace = true
lsp-types.workspace = true

# Async runtime
tokio.workspace = true
futures = "0.3"

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true

# Concurrent data structures
dashmap.workspace = true

# Parallel processing
rayon = "1.8"

# Utilities
parking_lot.workspace = true
lru.workspace = true
once_cell.workspace = true
regex = "1"
unicode-ident.workspace = true
unicode-general-category.workspace = true
dirs = "5"
bincode = "1"
salsa.workspace = true
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
fs2 = "0.4"
tempfile = "3.8"
toml = "0.8"

# File system watching for external change detection
notify = "6.1"
notify-debouncer-full = "0.3"

# ZIP archive support for JDK src.zip extraction
zip = "9.1.3"

# Internal dependencies
hyperion-parser.workspace = true
hyperion-kotlin.workspace = true
hyperion-groovy.workspace = true
hyperion-scala.workspace = true
hyperion-semantics.workspace = true
hyperion-build.workspace = true
hyperion-layout.workspace = true
hyperion-bytecode.workspace = true
hyperion-refactor.workspace = true
hyperion-actions.workspace = true
hyperion-workspace.workspace = true
hyperion-types.workspace = true
hyperion-fmt.workspace = true
hyperion-security.workspace = true
hyperion-dap.workspace = true

# Rowan (for text ranges)
rowan.workspace = true
clap = { version = "4.5.53", features = ["derive"] }
glob = "0.3"
roxmltree.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
env_logger = "0.11"
criterion.workspace = true
serial_test = "3"
walkdir = "2"
# For driving `tower_lsp::LspService` directly (Service::call) in the
# hyperion.run / hyperion.runTest end-to-end command test.
tower = "0.4"

[[bench]]
name = "lsp_operations"
harness = false

[[bench]]
name = "cold_start"
harness = false

[[bin]]
name = "hyperion-lsp"
path = "src/main.rs"
