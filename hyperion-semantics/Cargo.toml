[package]
name = "hyperion-semantics"
publish = false
description = "Incremental Java and Kotlin semantic analysis"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Incremental computation framework
salsa.workspace = true

# Syntax tree from parser
hyperion-parser.workspace = true
hyperion-kotlin = { path = "../hyperion-kotlin" }
hyperion-types.workspace = true
hyperion-workspace.workspace = true
rowan.workspace = true

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Concurrent data structures
dashmap.workspace = true
parking_lot.workspace = true
im.workspace = true

# Utilities
itertools.workspace = true
once_cell.workspace = true
smallvec.workspace = true

# Logging
tracing.workspace = true

# LSP types for SymbolKind
lsp-types.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
tempfile.workspace = true

[[bench]]
name = "type_inference"
harness = false

[[bench]]
name = "nullability"
harness = false
