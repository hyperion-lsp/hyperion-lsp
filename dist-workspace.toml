[workspace]
members = ["cargo:."]

# Config for 'dist' (https://opensource.axo.dev/cargo-dist/).
# Regenerate .github/workflows/release.yml with `dist generate` after editing.
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# Release hosting
hosting = "github"
# The installers to generate for each app. The homebrew installer only
# generates Formula/hyperion-lsp.rb as a release asset; it is not pushed to
# the tap from here (see the empty publish-jobs below).
installers = ["shell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
# Homebrew formula name and tap. The tap repository syncs the formula from the
# release asset itself, so no cross-repository token is needed.
tap = "hyperion-lsp/homebrew-tap"
formula = "hyperion-lsp"
# Do not publish to the tap from the release workflow.
publish-jobs = []
# Install the shell-installer binary next to the build script's destination.
install-path = "~/.local/bin"
# Files added to every archive (LICENSE* and README/CHANGELOG are picked up
# automatically). THIRD_PARTY_LICENSES is generated by
# .github/dist-build-setup.yml before each build (see about.toml).
include = ["NOTICE", "THIRD_PARTY_LICENSES"]
# Run `dist plan` on pull requests so release configuration errors surface early.
pr-run-mode = "upload"
# Extra steps run before every build job: generate THIRD_PARTY_LICENSES.
github-build-setup = "../dist-build-setup.yml"

[dist.github-custom-runners]
aarch64-unknown-linux-gnu = "ubuntu-22.04-arm"
x86_64-unknown-linux-gnu = "ubuntu-22.04"
aarch64-apple-darwin = "macos-15"
x86_64-apple-darwin = "macos-15-intel"
x86_64-pc-windows-msvc = "windows-2022"
